# ============================================================
# Healthcare_Master_Data_Management - dbt project configuration
#
# Scope: this dbt project models the STAGING -> MDM -> MASTER portion of
# the pipeline on Snowflake (see snowflake/04_create_staging_tables.sql
# onward). The earlier RAW -> LANDING -> STAGING stages are heavy,
# stateful Spark/Delta jobs (batch control, DQ rule execution, surrogate
# key generation) and stay in Databricks (see src/ and Databricks/) rather
# than being reimplemented as dbt SQL models - this project intentionally
# picks up the pipeline where it becomes pure SQL transformation.
#
# Schema naming: The custom generate_schema_name macro at
# dbt/macros/get_custom_schema.sql ensures dbt creates objects in the
# correct schemas:
#   staging models +schema: staging -> HMDM_DEV.STAGING (not STAGING_staging)
#   marts models   +schema: mdm     -> HMDM_DEV.MDM (not STAGING_mdm)
# This is critical for the Snowpark snapshot script which reads from
# HMDM_DEV.MDM.master_hcp and HMDM_DEV.MDM.master_hco.
#
# External dependency: HCP child master models (master_hcp_specialty,
# master_hcp_alternate_name, master_hcp_license, master_hcp_therapeutic_area)
# read from source('mdm_hub', ...) which are HMDM_DEV.MDM.* tables created
# by the Informatica MDM Hub, NOT by this repository. These tables must
# exist and be populated before dbt models that depend on them can run.
# ============================================================
name: 'healthcare_mdm'
version: '1.0.0'
config-version: 2

profile: 'healthcare_mdm'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  healthcare_mdm:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: mdm
